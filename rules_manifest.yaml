      - groq.com
      - openrouter.ai
      - together.ai
      - poe.com
      - suno.com
      - suno.ai
      - elevenlabs.io
    note: 校准（2026-09-27 实测）：blackmatrix7 无 AI 聚合目录，转自维护兜底清单（未被单列的 AI 服务）；
      校准（2026-10-09 实测）：补 suno/elevenlabs——这些高频 AI 服务在 Global 集（落 🚀）而不在
      本集，用户钉 🧠 组切组无效

