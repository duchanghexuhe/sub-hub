      - cursor-cdn.com   # 客户端 CDN
    note: 校准（2026-09-27 实测）：blackmatrix7 无 Cursor/CursorAI 规则集，转自维护内置基线；
      校准（2026-10-09 实测）：补 cursorapi.com/cursor-cdn.com——Cursor 客户端的模型 API/CDN
      流量原被 Global 集推向 🚀，与 🧠 组脱钩，用户钉 🧠 切组无效

