    clash_file: GitHub.yaml
    sr_file: GitHub.list
    policy: "📢 谷歌服务"
    behavior: classical
    note: 大厂四件套里 GitHub 无专属组，归入谷歌服务组（默认 ♻️ 常规自动，可手动改）

  - name: Google
    category: 大厂
