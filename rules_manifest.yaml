    upstream_file: Global
    upstream_clash: Global_Domain               # 主 Global.yaml 为残缺桩；_Domain 双格式完整且等价（payload 纯域名）
    upstream_sr: Global_Domain
    clash_file: Global.yaml
    sr_file: Global.list
    policy: "🚀 节点选择"
    behavior: domain
    note: 校准（2026-09-27）：上游主 yaml/.list 均为残缺桩，改用 _Domain 变体，behavior 相应由 classical 调整为 domain

