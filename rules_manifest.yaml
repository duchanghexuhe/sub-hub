# rules_manifest.yaml — 规则集清单（docs/02 §3 的文件化）
# 消费方：rulesync（定时镜像上游到 data/rules/）与 templater（生成 rule-providers / RULE-SET）。
# 客户端 RULE-SET 一律指向 http://<nas>:8399/rules/<file>，永远只碰 NAS。
#
# 字段说明：
#   name        逻辑名（= 缓存文件基名，data/rules/<clash_file>|<sr_file>）
#   category    类目（docs/02 §3 表格列）
#   source      上游来源键，见 sources；builtin 表示容器内置自维护规则
#   upstream_file  上游规则目录名（= URL 模板 {dir}；source 为 builtin 时无此字段）
#   upstream_clash / upstream_sr
#               可选：URL 模板 {file} 文件基名覆盖（缺省同 upstream_file；
#               用于上游变体文件，如 Netflix 的完整版为 Netflix_Classical.yaml）
#   clash_file  Clash/mihomo 格式缓存文件名（.yaml）
#   sr_file     SR 格式缓存文件名（.list）
#   policy      规则链中该规则集的出口组（组名以 docs/02 §2 为准）或 DIRECT
#   behavior    mihomo rule-providers 行为：domain / ipcidr / classical
#   processes   可选：进程钉组（PROCESS-NAME），仅进 Clash 系产物规则链尾
#               （MATCH 前）；SR 端无进程概念，自动跳过
#   note        转换/兜底说明
# 列表顺序即规则链顺序（docs/02 §3「规则链顺序」），templater 不得重排。

manifest_version: 1

sources:
  # blackmatrix7/ios_rule_script 同仓库双格式：{dir}=规则目录（upstream_file），
  # {file}=文件基名（缺省同 upstream_file；两格式基名不一致时用 upstream_clash/upstream_sr 覆盖）
  blackmatrix7_clash: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/{dir}/{file}.yaml
  blackmatrix7_sr: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/{dir}/{file}.list
  # Loyalsoldier/clash-rules release 分支为 txt payload，rulesync 需转换为 yaml/list 双格式缓存
  loyalsoldier: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/{file}
  builtin: builtin   # 自维护 claude-extra：随容器打包内置基线，rulesync 只需复制到 data/rules/

rules:
  # ---- 1. Claude（自维护补丁最前，防上游漏域）----
  - name: claude-extra
    category: Claude（自维护补丁）
    source: builtin
    clash_file: claude-extra.yaml
    sr_file: claude-extra.list
    policy: "🛑 Claude 专用"
    behavior: classical   # payload 为 TYPE,value 行（DOMAIN/DOMAIN-SUFFIX），mihomo behavior 须为 classical
    domains:
      - api.anthropic.com
      - claude.ai
      - claude.com
      - statsig.anthropic.com
      - console.anthropic.com
      - anthropic.com
      - claudeusercontent.com
    note: 显式钉死 Claude Code / claude.ai 相关端点（claudeusercontent.com 为 artifacts 内容域）；增删域名只改本文件

  # ---- 2. 富途（自维护直连补丁）----
  - name: futu-extra
    category: 直连（自维护补丁）
    source: builtin
    clash_file: futu-extra.yaml
    sr_file: futu-extra.list
    policy: DIRECT
    behavior: classical   # payload 为 DOMAIN-SUFFIX,x 行，behavior 须为 classical
    domains:
      - futu.cn
      - futu.com
      - futu5.com
      - futubull.cn
      - futuniuniu.com
      - futunn.com
      - futuhk.com
      - futuhk1.com
      - futuhk2.com
      - futuhkapp.com
      - futuhn.com
      - futusg.com
      - futuau.com
      - futu0.com
      - futu1.com
      - futu2.com
      - futu3.com
      - futu4.com
      - futu6.com
      - futu7.com
      - futu8.com
      - futu9.com
      - futu.link
      - futustatic.com
      - futuesop.com
      - futufin.com
      - fututrade.com
      - fututrustee.com
      - futuholdings.com
      - futuinc.com
      - futuoa.com
      - futuchain.com
      - futunited.com
      - moomoo.com
      - moomoo.com.hk
      - moomooapp.com
      - moomoobull.com
      - moomooequity.com
      - moomootrustee.com
    ips: []   # 行情网关裸 IP 段（App 经 HTTPDNS 自解析直连第三方机房时，域名规则拦不住）。
              # 漏网之鱼已改默认 DIRECT（2026-09-29），裸 IP 落 MATCH 即直连，本字段降级为
              # 可选钉死层（防鱼组被手动切回 🚀 的场景）；取证法：mihomo connections API 或
              # SR 连接页筛富途连接，按 IP-CIDR 填此处，例: - 103.40.13.0/24
    note: 校准（2026-09-29 实测）：blackmatrix7 Global 规则集把富途系域名（futu5/futunn/futu0-9/
      moomoo 等 30+ 域）显式推向代理，富途按境外 IP 发 15 分钟延迟行情；ChinaMax 亦无覆盖。
      域名全集取自上游 Global 的 futu*/moomoo* 归类，转自维护直连，增删只改本文件

  # ---- 3. Steam（自维护补丁：下载 CDN 钉直连）----
  - name: steam-download
    category: 直连（自维护补丁）
    source: builtin
    clash_file: steam-download.yaml
    sr_file: steam-download.list
    policy: DIRECT
    behavior: classical   # payload 为 DOMAIN-SUFFIX,x 行，behavior 须为 classical
    domains:
      - steamcontent.com   # 游戏内容 CDN（所有大流量下载）
      - steamserver.net    # Steam 网络/边缘 CDN
      - steamchina.com     # 蒸汽平台（国服）
      - steampipe.akamaized.net   # Akamai 分支下载 CDN（主 CDN 不可用时客户端自动换源）；精确主机，勿放宽为整个 akamaized.net
    note: 校准（2026-10-04 实测）：游戏下载走直连是对的（满带宽且不烧机场流量）；
      显式钉死而不赌漏网之鱼默认值——鱼组被手动切回 🚀 时下载流量不跟着改道代理

  # ---- 4. Steam（自维护补丁：官网系走代理）----
  - name: steam-extra
    category: Steam（自维护补丁）
    source: builtin
    clash_file: steam-extra.yaml
    sr_file: steam-extra.list
    policy: "🚀 节点选择"
    behavior: classical
    domains:
      - steampowered.com       # 商店/登录/API/客户端引导下载
      - steamcommunity.com     # 社区（被墙，直连必挂）
      - steamstatic.com        # 商店静态资源 CDN
      - steamusercontent.com   # 用户内容（截图/创意工坊预览）
      - steam-chat.com         # 网页版好友聊天
      - steamgames.com         # Valve 老域名
      - steamdb.info           # 第三方数据查询
    note: 校准（2026-10-04 实测）：Global/ChinaMax 均不覆盖 steampowered/steamcommunity
      （Global 仅 steamconnecttest.com，ChinaMax 只收国内第三方站），漏网之鱼翻转默认
      直连后官网系全部落 MATCH 直连被墙不可用；显式钉死走代理，下载 CDN 由
      steam-download 前置钉直连互不干扰

  # ---- 4.5 直连修正（自维护补丁：回收被 Global/Google 抢先的国内可达域）----
  - name: direct-fix
    category: 直连（自维护补丁）
    source: builtin
    clash_file: direct-fix.yaml
    sr_file: direct-fix.list
    policy: DIRECT
    behavior: classical   # payload 为 DOMAIN-SUFFIX,x 行，behavior 须为 classical
    domains:
      # NVIDIA 驱动链路（2026-10-09 NAS 直连实测：检测 307→geforce.cn、下载
      # 301→nvidia.cn，cn.download.nvidia.cn 拉满 107Mbps；须成对直连——只钉下载域时
      # 检测走代理拿海外链接，下载直连反而断链）
      - gfwsl.geforce.com        # 驱动检测入口（Akamai 按 CC=CN 导中国站）
      - geforce.cn               # 检测中国站（gfwsl.geforce.cn）
      - us.download.nvidia.com   # NVIDIA App 下载主域（301→cn.download.nvidia.cn）
      - cn.download.nvidia.com   # 下载入口（ChinaMax 同名条目被 Global 抢先成死条目）
      - nvidia.cn                # 下载 CDN + 中文主站
      # JetBrains（2026-10-09 实测：download 302→download-cdn.clf.jetbrains.com.cn）
      - download.jetbrains.com
      - jetbrains.com.cn         # 中国下载 CDN（含 download-cdn.clf.*）
      - data.services.jetbrains.com   # 更新元数据 API
      # Adobe 创意云下载 CDN
      - download.adobe.com
      - ccmdls.adobe.com
      # Chrome 组件与 Google 中国特供域（ChinaMax 收录但被 Google 集抢先的死条目回收；
      # redirector 后续 sn-* 动态节点落漏网之鱼默认直连兜底）
      - redirector.gvt1.com
      - redirector.gcpcdn.gvt1.com
      - redirector.offline-maps.gvt1.com
      - redirector.snap.gvt1.com
      - beacons.gvt2.com
      - beacons2.gvt2.com
      - beacons3.gvt2.com
      - beacons.gcp.gvt2.com
      - gvt2-cn.com
      - recaptcha.net            # reCAPTCHA 中国镜像（Google 官方国内可用版）
      - recaptcha-cn.net
      - cn.widevine.com          # Widevine DRM 中国镜像
      - dartsearch-cn.net
      - doubleclick-cn.net
      - admob-cn.com
      - 2mdn-cn.net
      - app-measurement-cn.com
      # NTP 对时（经代理 UDP 转发漂移大）
      - cn.pool.ntp.org
      # 厂商中国 CDN（仅收实测可达者）
      - support-cn.samsung.com
      - ztedevices.com
    note: 校准（2026-10-09 实测）：scripts/audit_dead_rules.py 全链模拟发现 157 条 ChinaMax
      条目被前位 Global/Google 抢先走代理（cn.download.nvidia.com 即此类死条目）。本集只收
      NAS 直连实测可达者；不可达不收（留在代理侧可用）：international.download.nvidia.com /
      www.nvidia.com / cdn.samsung.com / cdn.jetbrains.com / gstatic-cn.com / qiao-cn.com /
      kaspersky 系（DNS 解析失败）。测速/排查脚本见 scripts/audit_dead_rules.py

  # ---- 5. M-Team（自维护补丁：PT tracker 钉直连）----
  - name: mteam-tracker
    category: 直连（自维护补丁）
    source: builtin
    clash_file: mteam-tracker.yaml
    sr_file: mteam-tracker.list
    policy: DIRECT
    behavior: classical   # payload 为 DOMAIN-SUFFIX,x 行，behavior 须为 classical
    domains:
      - t.m-team.cc
      - tracker.m-team.cc
      - tr.m-team.cc
      - announce.m-team.cc
      - t.m-team.io
      - tracker.m-team.io
      - tr.m-team.io
      - announce.m-team.io
    note: PT tracker/announce 必须以真实 IP 汇报（经代理汇报会被 tracker 记成出口 IP，
      做种联通性归零伤分享率），且机场普遍禁 P2P——announce 域名候选全量前置钉死
      直连，防 mteam-web 整域后缀误伤；裸 IP 的 peer 连接落漏网之鱼默认直连，无需处理

  # ---- 6. M-Team（自维护补丁：站点走代理）----
  - name: mteam-web
    category: PT（自维护补丁）
    source: builtin
    clash_file: mteam-web.yaml
    sr_file: mteam-web.list
    policy: "🚀 节点选择"
    behavior: classical
    domains:
      - m-team.cc
      - m-team.io
    note: 校准（2026-10-04 实测）：ChinaMax 把 m-team.cc 误归类国内直连（.m-team.cc
      在 ChinaMax_Domain 中），站点直连不可用；整域后缀走代理（tracker 域已被
      mteam-tracker 前置钉直连），增删 PT 站照此两段式复制

  # ---- 7. Claude（上游）----
  - name: Claude
    category: Claude（上游）
    source: blackmatrix7
    upstream_file: Claude
    clash_file: Claude.yaml
    sr_file: Claude.list
    policy: "🛑 Claude 专用"
    behavior: classical

  # ---- 8. AI 单列 → 各自组 ----
  - name: OpenAI
    category: AI 单列
    source: blackmatrix7
    upstream_file: OpenAI
    clash_file: OpenAI.yaml
    sr_file: OpenAI.list
    policy: "🎁 OpenAI"
    behavior: classical

  # ---- 8.2 Gemini（自维护补丁：AI Studio 现用主域，置于 Gemini 之前）----
  - name: gemini-extra
    category: AI 单列（自维护补丁）
    source: builtin
    clash_file: gemini-extra.yaml
    sr_file: gemini-extra.list
    policy: "🤖 Gemini"
    behavior: classical   # payload 为 DOMAIN-SUFFIX,x 行，behavior 须为 classical
    domains:
      - aistudio.google.com
    note: 校准（2026-10-09 实测）：上游 Gemini 集（2025-06-06 版）只收旧名 makersuite.google.com
      与 ai.google.dev，无 AI Studio 现用主域 aistudio.google.com——该域命中 Google 集落
      📢 谷歌服务（首位默认 ♻️ 常规自动＝任意最快节点，出口地区不受控），而 🤖 Gemini 组
      是美国 url-test（满足出口地区要求）。置于 Gemini 之前（且远早于 Google 集）显式归组

  - name: Gemini
    category: AI 单列
    source: blackmatrix7
    upstream_file: Gemini
    clash_file: Gemini.yaml
    sr_file: Gemini.list
    policy: "🤖 Gemini"
    behavior: classical

  - name: Copilot
    category: AI 单列
    source: blackmatrix7
    upstream_file: Copilot
    clash_file: Copilot.yaml
    sr_file: Copilot.list
    policy: "🐙 Copilot"
    behavior: classical

  - name: Grok
    category: AI 单列
    source: builtin
    clash_file: Grok.yaml
    sr_file: Grok.list
    policy: "🧠 通用 AI"     # 无专属组：未被单列组的 AI 服务统一进通用 AI（docs/02 §2）
    behavior: classical   # payload 为 DOMAIN-SUFFIX,x 行，behavior 须为 classical
    domains:
      - x.ai
      - grok.com   # 网页版主入口（上游 Twitter 集收 grok.com，本集先行命中）
    note: 校准（2026-09-27 实测）：blackmatrix7 无 Grok 规则集（Clash/SR 两树均 404），转自维护内置基线；
      校准（2026-10-09 实测）：补 grok.com——本集（第 11 位）先于 Twitter 集（第 17 位），缺失时
      Grok 网页版主入口被 Twitter 集抢到 🚀，API（x.ai 后缀）与网页版对 🧠 组的随动语义分裂

  - name: Perplexity
    category: AI 单列
    source: builtin
    clash_file: Perplexity.yaml
    sr_file: Perplexity.list
    policy: "🧠 通用 AI"
    behavior: classical
    domains:
      - perplexity.ai
      - pplx.ai
    note: 校准（2026-09-27 实测）：blackmatrix7 无 Perplexity 规则集，转自维护内置基线

  - name: CursorAI
    category: AI 单列
    source: builtin
    clash_file: CursorAI.yaml
    sr_file: CursorAI.list
    policy: "🧠 通用 AI"
    behavior: classical
    domains:
      - cursor.com
      - cursor.sh
