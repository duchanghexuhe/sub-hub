    category: 社交（自维护补丁）
    source: builtin
    clash_file: telegram-extra.yaml
    sr_file: telegram-extra.list
    policy: "📲 Telegram"
    behavior: classical   # payload 为 IP-CIDR,x 行（DC 网段），mihomo behavior 须为 classical
    ips:
      - 91.108.0.0/16
      - 149.154.160.0/20
      - 5.28.192.0/18
      - 109.239.140.0/24
      - 139.59.210.98/32
      - 196.55.216.167/32
      - 2001:67c:4e8::/48
