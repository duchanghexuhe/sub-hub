    servername: us-dmit-01.example-airport-a.com

  - name: "🇺🇸 美国 圣何塞 专线 x2"
    type: vless
    server: us-sjc-02.example-airport-a.com
    port: 443
    uuid: "33333333-3333-4333-8333-333333333303"
    network: ws
    udp: true
    tls: true
    servername: us-sjc-02.example-airport-a.com
    ws-opts:
      path: /ws
      headers:
        Host: us-sjc-02.example-airport-a.com

