# sub_a.yaml — 机场 A 订阅 fixture（Clash YAML 直出格式）
# 14 条 proxies：12 个真实节点（vless 10 / ss 3 / anytls 1，其中 2 个假节点为 ss）+ 2 个假节点。
# 覆盖：美国 3（家宽 1、DMIT 机房 1、x2 倍率 1）、香港 2、台湾/日本/新加坡/韩国/英国/德国各 1、
#       无地区特征 1、假节点 2（「剩余流量」「官网」）。
proxies:
  - name: "🇺🇸 美国 洛杉矶 家庭宽带 01"
    type: vless
    server: us-lax-01.example-airport-a.com
    port: 443
    uuid: "11111111-1111-4111-8111-111111111101"
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    servername: us-lax-01.example-airport-a.com

  - name: "🇺🇸 美国 DMIT 高防机房 01"
    type: vless
    server: us-dmit-01.example-airport-a.com
