# sub-hub — NAS 实际部署编排（落在 /share/Container/sub-hub/docker-compose.yml）
# 镜像在 Windows 本机构建后 docker save | ssh nas docker load 直传，NAS 上不构建；
# 更新流程见仓库 README「NAS 部署」。本文件是 NAS 侧实际运行的编排的存档。
services:
  sub-hub:
    image: sub-hub:latest
    container_name: sub-hub
    ports:
      - "8399:8399"          # 管理页面/分发端点/规则分发
    volumes:
      - ./data:/app/data     # SQLite、密钥、token、产物版本、规则缓存、探测配置全部在此持久化
    environment:
      SUBHUB_HOST: 0.0.0.0
      SUBHUB_PORT: 8399
      SUBHUB_NAS_HOST: 192.168.31.10   # 构造分发链接用
      # 容器默认 UTC 而代码全用 datetime.now()：不设 TZ 时落库时间戳与每日
      # 纯净度扫描时刻都比北京时间早 8 小时。镜像内已带 tzdata。
      TZ: Asia/Shanghai
      # 规则上游（raw.githubusercontent.com）直连失败时的回落代理（Windows 主机 Clash，
      # 与 NAS dockerd 同一代理惯例）；仅作用于规则镜像，机场订阅始终直连。
      # Clash 关闭时规则自动回落内置基线/缓存，分发与发布链路不受影响。
      SUBHUB_RULES_PROXY: http://192.168.31.132:7897
      # HTTPS_PROXY 仅供默认 trust_env 的客户端（= 镜像推送）使用：2026-09-30 实测
      # GFW 对 api.cloudflare.com 的 IPv4 DNS 污染（解析到非 CF IP、证书主机名不匹配，
      # IPv6 正常但容器无 IPv6），推送须经 Clash 出口在远端解析域名。
      # 机场订阅（fetcher）/探测（probe）/规则镜像（rulesync）均显式 trust_env=False
      # 或显式指定代理，不受此变量影响；本机回环也用 NO_PROXY 兜底。
      HTTPS_PROXY: http://192.168.31.132:7897
      NO_PROXY: localhost,127.0.0.1
      # 不设 HTTP_PROXY（明文 http 目标保持直连）；Clash 关闭时镜像推送会失败，
      # 但仅影响公网镜像更新，本地分发与发布链路不受影响。
    restart: unless-stopped
